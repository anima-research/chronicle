name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Bounds a hung run, which would otherwise hold its runner for six hours.
    # On Node 22.12.0, node --test can loop forever when a child's output
    # splits at an unlucky byte (nodejs/node#62693, fixed by nodejs/node#62704
    # in later releases). The limit covers every leg of the matrix.
    timeout-minutes: 30

    # The floor package.json's engines promises, pinned exactly, the newest
    # Node, and 24, the maintained line between them.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24', 'latest']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      # No napi-bindings feature here: napi symbols only exist inside a Node
      # process, so test executables cannot link with it (the cdylib can).
      # The napi surface is covered by the napi build + node smoke test below.
      - name: Cargo tests
        run: cargo test

      - name: Build native module (debug)
        run: npx napi build --platform --features napi-bindings

      - name: Node smoke test
        run: npm test
