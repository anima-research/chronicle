name: Checkpoint platforms

on:
  push:
    paths:
      - '.github/workflows/checkpoint-platforms.yml'
      - 'Cargo.toml'
      - 'build.rs'
      - 'src/**'
      - 'tests/atomic_metadata.rs'
      - 'tests/blob_storage.rs'
      - 'tests/lock_file.rs'
  pull_request:
    paths:
      - '.github/workflows/checkpoint-platforms.yml'
      - 'Cargo.toml'
      - 'build.rs'
      - 'src/**'
      - 'tests/atomic_metadata.rs'
      - 'tests/blob_storage.rs'
      - 'tests/lock_file.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-tests:
    name: Checkpoints (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Bounds a hung run, which would otherwise hold its runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Exercise native file replacement, permissions, long paths and caching.
      # Cross-compilation alone cannot establish these OS filesystem contracts.
      - name: Atomic checkpoint unit tests
        run: cargo test --lib atomic_file -- --nocapture

      - name: Store checkpoint integration tests
        run: cargo test --test atomic_metadata -- --nocapture

      - name: Blob store tests
        run: cargo test --test blob_storage -- --nocapture

      - name: Blob storage unit tests
        run: cargo test --lib 'blobs::' -- --nocapture

      # LOCK's handling depends on each platform's locks (mandatory on
      # Windows) and file types, so its tests run here too.
      - name: Store lock tests
        run: cargo test --test lock_file -- --nocapture

      - name: Lock error mapping test
        run: cargo test --lib store::tests::only_another_holders_lock_is_reported_as_locked -- --nocapture
